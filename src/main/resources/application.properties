spring.application.name=diploma-plan-service

spring.threads.virtual.enabled=true

server.port=9092

spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:9082/plan
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

server.servlet.context-path=/api/plan

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

spring.jpa.show-sql=true

spring.http.serviceclient.trip-service.base-url=${TRIP_SERVICE_URL:http://localhost:9091}

# LLM providers
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=
spring.ai.anthropic.chat.max-tokens=16000
llm.anthropic.effort=medium

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-6-luna
spring.ai.openai.chat.max-completion-tokens=16000
spring.ai.openai.chat.reasoning-effort=medium

