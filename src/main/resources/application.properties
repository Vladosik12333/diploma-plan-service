spring.application.name=diploma-plan-service

spring.threads.virtual.enabled=true

server.port=9092

spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:9082/plan
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

server.servlet.context-path=/api/plan

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

spring.jpa.show-sql=true

spring.http.serviceclient.trip-service.base-url=${TRIP_SERVICE_URL:http://localhost:9091}
spring.http.serviceclient.trip-service.connect-timeout=2s
spring.http.serviceclient.trip-service.read-timeout=3s

# Trip service resilience
resilience4j.circuitbreaker.instances.trip-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.trip-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.trip-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.trip-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.trip-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.trip-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.trip-service.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.trip-service.ignore-exceptions[0]=org.springframework.web.client.HttpClientErrorException

resilience4j.retry.instances.trip-service.max-attempts=3
resilience4j.retry.instances.trip-service.wait-duration=500ms
resilience4j.retry.instances.trip-service.enable-exponential-backoff=true
resilience4j.retry.instances.trip-service.exponential-backoff-multiplier=2
resilience4j.retry.instances.trip-service.ignore-exceptions[0]=org.springframework.web.client.HttpClientErrorException

# LLM providers
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=
spring.ai.anthropic.chat.max-tokens=16000
llm.anthropic.effort=medium

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-6-luna
spring.ai.openai.chat.max-completion-tokens=16000
spring.ai.openai.chat.reasoning-effort=medium

